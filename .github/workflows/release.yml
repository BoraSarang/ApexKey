name: Release

# 커밋된 태그(vX.Y.Z)를 누르면 macOS Release 빌드 + GitHub Release 생성 (DMG 단일)
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (macOS)
    runs-on: macos-latest
    env:
      APP_NAME: ApexKey
      BUNDLE_ID: com.borasarang.ApexKey
      DEVELOPMENT_TEAM: 6GPJQ7BQC9
      ARCHIVE_DIR: /tmp/apexkey-release
      NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode 버전 확인
        run: xcodebuild -version

      - name: xcodegen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        run: xcodegen generate --spec project.yml

      - name: 태그-번들 버전 일치 검증
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Sources/ApexKey/Info.plist)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "버전 불일치: 태그=${EXPECTED} 번들=${ACTUAL} — Info.plist를 먼저 범프하세요"
            exit 1
          fi

      - name: Release 빌드 (서명 없음 — CI)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM}" \
            build

      - name: 단위 테스트
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM}" \
            2>&1 | tail -30

      - name: 앱 번들 준비
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/${APP_NAME}.app"
          mkdir -p "${ARCHIVE_DIR}"
          cp -R "${APP_PATH}" "${ARCHIVE_DIR}/${APP_NAME}.app"
          # 문구용 버전 (태그 'v' 제거, 예: v1.0.0 → 1.0.0)
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
          VERSION="${GITHUB_REF_NAME#v}"
          # Info.plist 버전 동기화
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" \
            "${ARCHIVE_DIR}/${APP_NAME}.app/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" \
            "${ARCHIVE_DIR}/${APP_NAME}.app/Contents/Info.plist" 2>/dev/null || true

      - name: DMG 생성 (create-dmg, 단일 산출물)
        run: |
          set -euo pipefail
          brew install create-dmg || true
          create-dmg \
            --volname "${APP_NAME}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 175 190 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 425 190 \
            "${ARCHIVE_DIR}/${APP_NAME}-${RELEASE_VERSION}-macOS.dmg" \
            "${ARCHIVE_DIR}/${APP_NAME}.app"

      - name: 노타라이즈 (선택 — 시크릿 설정 시)
        if: env.NOTARIZE == 'true'
        run: |
          set -euo pipefail
          APP_PATH="${ARCHIVE_DIR}/${APP_NAME}.app"
          ZIP="${ARCHIVE_DIR}/notarize-upload.zip"
          # 코드 서명 (Developer ID — 설치된 인증서 사용)
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "${IDENTITY}" ]; then
            echo "WARN: Developer ID 인증서 없음 — 노타라이즈 건너뜀"
          else
            codesign --force --options runtime --sign "${IDENTITY}" --deep "${APP_PATH}"
            ditto -c -k --keepParent "${APP_PATH}" "${ZIP}"
            xcrun notarytool submit "${ZIP}" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
              --wait
            xcrun stapler staple "${APP_PATH}" || true
          fi

      - name: GitHub Release 생성 및 업로드 (DMG 단일)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # release-notes/<tag>.md가 있으면 그것을 본문으로, 없으면 자동 생성
          TAG="${GITHUB_REF_NAME}"
          DMG="${ARCHIVE_DIR}/${APP_NAME}-${RELEASE_VERSION}-macOS.dmg"
          if [ -f "release-notes/${TAG}.md" ]; then
            gh release create "${TAG}" --title "ApexKey ${TAG}" \
              --notes-file "release-notes/${TAG}.md" "${DMG}"
          else
            gh release create "${TAG}" --title "ApexKey ${TAG}" \
              --generate-notes "${DMG}"
          fi
