name: ApexKey
options:
  bundleIdPrefix: com.borasarang
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  knownRegions:
    - Base
    - en
    - ko
targets:
  ApexKey:
    type: application
    platform: macOS
    sources:
      - Sources/ApexKey
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.ApexKey
        PRODUCT_NAME: ApexKey
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6GPJQ7BQC9
        DEVELOPMENT_LANGUAGE: en
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: SwiftUI.framework
    info:
      path: Sources/ApexKey/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDisplayName: "ApexKey"
        CFBundleName: "ApexKey"
        LSHasLocalizedDisplayName: true
        LSUIElement: true
        NSAppleEventsUsageDescription: "ApexKey가 다른 앱의 메뉴 명령을 실행하기 위해 시스템 이벤트 접근이 필요합니다."
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.borasarang.ApexKey
            CFBundleURLSchemes:
              - apexkey
  ApexKeyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/ApexKeyTests
    dependencies:
      - target: ApexKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.ApexKeyTests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6GPJQ7BQC9
        DEVELOPMENT_LANGUAGE: en
        GENERATE_INFOPLIST_FILE: YES
