name: ApexKey
options:
  bundleIdPrefix: com.borasarang
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  knownRegions:
    - Base
    - en
    - ko
targets:
  ApexKey:
    type: application
    platform: macOS
    sources:
      - Sources/ApexKey
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.ApexKey
        PRODUCT_NAME: ApexKey
        # ── 버전 단일 출처 (E-MAC-REL-9301) ─────────────────────────────
        # Info.plist에 버전을 하드코딩하면 xcodegen이 plist를 매 빌드 재생성하면서
        # 되돌렸다가 수동 커밋으로 되돌리는 사고가 반복됐다 (실제 발생: 1.3.0 → 1.0).
        # project.yml을 유일한 출처로 두고 plist는 빌드 시 변수로 치환한다.
        # 버전 올리는 법: 아래 MARKETING_VERSION 한 줄만 수정.
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        # Apple Events(자동화) — 없으면 하드닝 런타임이 프롬프트 없이 -1743으로 거부 (T-195 실측)
        CODE_SIGN_ENTITLEMENTS: Sources/ApexKey/ApexKey.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6GPJQ7BQC9
        DEVELOPMENT_LANGUAGE: en
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: SwiftUI.framework
    info:
      path: Sources/ApexKey/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # 버전은 project.yml의 MARKETING_VERSION/CURRENT_PROJECT_VERSION에서 치환 (E-MAC-REL-9301)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: "ApexKey"
        CFBundleName: "ApexKey"
        LSHasLocalizedDisplayName: true
        LSUIElement: true
        NSAppleEventsUsageDescription: "ApexKey가 파인더·터미널 등 다른 앱을 제어하기 위해 자동화 접근이 필요합니다."
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.borasarang.ApexKey
            CFBundleURLSchemes:
              - apexkey
  ApexKeyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/ApexKeyTests
    dependencies:
      - target: ApexKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.ApexKeyTests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6GPJQ7BQC9
        DEVELOPMENT_LANGUAGE: en
        GENERATE_INFOPLIST_FILE: YES
